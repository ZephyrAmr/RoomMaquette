name: Build iOS RoomMaquette

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build iOS IPA & Simulator App
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Show Build Schemes & Targets
        run: |
          xcodebuild -project RoomMaquette/RoomMaquette.xcodeproj -list

      - name: Build App for Physical iOS Device (Unsigned)
        run: |
          mkdir -p build/DerivedData
          xcodebuild clean build \
            -project RoomMaquette/RoomMaquette.xcodeproj \
            -scheme RoomMaquette \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA (Sideloadable with Sideloadly or AltStore)
        run: |
          mkdir -p Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/RoomMaquette.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for RoomMaquette.app..."
            APP_PATH=$(find build/DerivedData -name "RoomMaquette.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r RoomMaquette-unsigned.ipa Payload
          ls -lh RoomMaquette-unsigned.ipa

      - name: Build iOS Simulator App (For Mac or Simulator Testing)
        run: |
          xcodebuild build \
            -project RoomMaquette/RoomMaquette.xcodeproj \
            -scheme RoomMaquette \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath build/DerivedDataSim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          SIM_APP_PATH=$(find build/DerivedDataSim -name "RoomMaquette.app" -type d | head -n 1)
          echo "Found simulator app at: $SIM_APP_PATH"
          zip -r RoomMaquette-Simulator.app.zip "$SIM_APP_PATH"
          ls -lh RoomMaquette-Simulator.app.zip

      - name: Upload Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomMaquette-iOS-Device-IPA
          path: RoomMaquette-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomMaquette-Simulator-App
          path: RoomMaquette-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14
