name: Build iOS RoomMaquette

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA & Simulator App
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Display Xcode Environment
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version

      - name: Show Build Schemes & Targets
        run: |
          xcodebuild -project RoomMaquette/RoomMaquette.xcodeproj -list

      - name: Build App for Physical iOS Device (Unsigned)
        run: |
          mkdir -p build/DerivedData
          set -o pipefail
          xcodebuild clean build \
            -project RoomMaquette/RoomMaquette.xcodeproj \
            -scheme RoomMaquette \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build_device.log || {
              echo "::error::Build failed! Printing compiler errors:"
              grep -E "(error:|fatal error:)" build_device.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              tail -n 60 build_device.log
              exit 1
            }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-device-log
          path: build_device.log

      - name: Package Unsigned IPA (Sideloadable with SideStore, AltStore, Sideloadly)
        run: |
          mkdir -p Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/RoomMaquette.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for RoomMaquette.app..."
            APP_PATH=$(find build/DerivedData -name "RoomMaquette.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r RoomMaquette-unsigned.ipa Payload
          cp RoomMaquette-unsigned.ipa RoomMaquette.ipa
          ls -lh RoomMaquette.ipa

      - name: Build iOS Simulator App (For Mac or Simulator Testing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project RoomMaquette/RoomMaquette.xcodeproj \
            -scheme RoomMaquette \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath build/DerivedDataSim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build_sim.log || {
              echo "::error::Simulator build failed! Here are the compiler errors:"
              grep -E "(error:|fatal error:)" build_sim.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              tail -n 60 build_sim.log
              exit 1
            }
          
          SIM_APP_PATH=$(find build/DerivedDataSim -name "RoomMaquette.app" -type d | head -n 1)
          echo "Found simulator app at: $SIM_APP_PATH"
          zip -r RoomMaquette-Simulator.app.zip "$SIM_APP_PATH"
          ls -lh RoomMaquette-Simulator.app.zip

      - name: Upload Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomMaquette-iOS-Device-IPA
          path: RoomMaquette.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomMaquette-Simulator-App
          path: RoomMaquette-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct-Install GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RoomMaquette Latest Release"
          body: |
            ## 📱 RoomMaquette Sideloading Release
            
            ### 🚀 One-Tap Installation on iPhone:
            - **SideStore Direct Install**: [Install in SideStore](sidestore://install?url=https://github.com/ZephyrAmr/RoomMaquette/releases/latest/download/RoomMaquette.ipa)
            - **AltStore Direct Install**: [Install in AltStore](altstore://install?url=https://github.com/ZephyrAmr/RoomMaquette/releases/latest/download/RoomMaquette.ipa)
            
            ### 🏪 Add as SideStore Source:
            - Tap to add source: [Add to SideStore](sidestore://source?url=https://raw.githubusercontent.com/ZephyrAmr/RoomMaquette/main/sidestore-source.json)
            - Or add manually in SideStore -> Sources: `https://raw.githubusercontent.com/ZephyrAmr/RoomMaquette/main/sidestore-source.json`
            
            ### 📦 Direct Downloads:
            - **[RoomMaquette.ipa](https://github.com/ZephyrAmr/RoomMaquette/releases/latest/download/RoomMaquette.ipa)** (Unsigned iOS app)
            - **[RoomMaquette-Simulator.app.zip](https://github.com/ZephyrAmr/RoomMaquette/releases/latest/download/RoomMaquette-Simulator.app.zip)** (Xcode Simulator)
          files: |
            RoomMaquette.ipa
            RoomMaquette-unsigned.ipa
            RoomMaquette-Simulator.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
